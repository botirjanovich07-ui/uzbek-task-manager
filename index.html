
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uzbek Task Manager</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 30px 15px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#667eea,#764ba2);
  min-height: 100vh;
}
.container {
  max-width: 550px;
  margin: 30px auto;
  background: white;
  padding: 28px;
  border-radius: 20px;
  box-shadow: 0 10px 35px #2223;
}
h1 { text-align: center; color: #5742a5; }
.subtitle { text-align: center; color: #777; }
.form { display: flex; gap: 8px; margin: 25px 0; }
input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}
button {
  border: none;
  border-radius: 10px;
  padding: 12px 16px;
  background: #6854cf;
  color: white;
  font-size: 15px;
  cursor: pointer;
}
button:hover { opacity: .85; }
.task {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #f5f4fc;
  padding: 13px;
  margin: 10px 0;
  border-radius: 10px;
}
.task span { flex: 1; overflow-wrap: anywhere; }
.task.done span {
  text-decoration: line-through;
  color: #999;
}
.delete { background: #e74c3c; }
.stats { text-align: center; color: #777; margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
  <h1>📝 My Tasks</h1>
  <p class="subtitle">Vazifalaringizni oson boshqaring!</p>

  <div class="form">
    <input id="taskInput" placeholder="Yangi vazifa yozing...">
    <button onclick="addTask()">+ Qo‘shish</button>
  </div>

  <div id="taskList"></div>
  <p class="stats" id="stats">Vazifalar: 0</p>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");

function save() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function addTask() {
  const input = document.getElementById("taskInput");
  const value = input.value.trim();
  if (!value) return;
  tasks.push({ text: value, done: false });
  input.value = "";
  save();
  render();
}

function toggleTask(index) {
  tasks[index].done = !tasks[index].done;
  save();
  render();
}

function deleteTask(index) {
  tasks.splice(index, 1);
  save();
  render();
}

function render() {
  const list = document.getElementById("taskList");
  list.innerHTML = "";

  tasks.forEach((task, index) => {
    const item = document.createElement("div");
    item.className = "task" + (task.done ? " done" : "");

    const check = document.createElement("input");
    check.type = "checkbox";
    check.checked = task.done;
    check.style.flex = "none";
    check.style.width = "20px";
    check.addEventListener("change", () => toggleTask(index));

    const name = document.createElement("span");
    name.textContent = task.text;

    const del = document.createElement("button");
    del.textContent = "O‘chirish";
    del.className = "delete";
    del.onclick = () => deleteTask(index);

    item.append(check, name, del);
    list.appendChild(item);
  });

  const completed = tasks.filter(t => t.done).length;
  document.getElementById("stats").textContent =
    `Jami: ${tasks.length} | Bajarilgan: ${completed}`;
}

document.getElementById("taskInput").addEventListener("keydown", e => {
  if (e.key === "Enter") addTask();
});

render();
</script>
</body>
</html>
